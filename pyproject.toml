[project]
name = "redraven-demo-python"
version = "0.1.0"
description = "Minimal demo for the RedRaven Python SDK."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "httpx>=0.27",
    "openai>=2.36.0",
    "python-dotenv>=1.0",
    # Resolved from the path below (editable). For PyPI-only, pin e.g. `redraven>=0.1.4` and remove [tool.uv.sources].
    "redraven",
    "tqdm>=4.66",
]

[tool.uv.sources]
# Sibling checkout: demo repo and redraven-sdk repo must live next to each other (see path).
redraven = { path = "../redraven-sdk/packages/python", editable = true }
